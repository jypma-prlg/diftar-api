name: NL API Design Rules

on:
  pull_request:
  workflow_dispatch: {}

jobs:
  lint:
    name: Valideer tegen NL API Design Rules (developer.overheid.nl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installeer tools uit mise.toml
        uses: jdx/mise-action@v5

      - name: Valideer met DON Checker (ADR-versie uit mise.toml)
        run: mise run validate-nl-api-design-rules
