name: Publiceer API-documentatie

on:
  push:
    branches:
      - main
    paths:
      - "diftar-openapi.yaml"
      - "mise.toml"
      - ".github/workflows/publiceer-documentatie.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Genereer Redoc-documentatie
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installeer tools uit mise.toml
        uses: jdx/mise-action@v5

      - name: Bouw statische Redoc-pagina
        run: |
          mkdir -p site
          redocly build-docs diftar-openapi.yaml --output site/index.html

      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload documentatie als Pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publiceer naar GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
