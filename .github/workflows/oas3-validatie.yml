name: OAS3-validatie

on:
  push:
    paths:
      - "diftar-openapi.yaml"
      - "mise.toml"
      - ".github/workflows/oas3-validatie.yml"
  pull_request:
    paths:
      - "diftar-openapi.yaml"
      - "mise.toml"
      - ".github/workflows/oas3-validatie.yml"
  workflow_dispatch: {}

jobs:
  lint:
    name: Valideer tegen OpenAPI 3.0-standaard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installeer tools uit mise.toml
        uses: jdx/mise-action@v5

      - name: Lint met Redocly CLI (OpenAPI 3.0-conformiteit)
        run: mise run validate-oas-spec
