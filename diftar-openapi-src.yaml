openapi: 3.0.3

info:
  title: Pinkroccade MijnOmgeving API
  description: |
    API for Pinkroccade MijnOmgeving mini-container dumps.
    Access requires an API key.
  version: "1.0.0"

servers:
  - url: https://dev.local/ecms-pinkroccade-api/
    description: Development server

tags:
  - name: Dumps
    description: Mini-container dumps

paths:
  /mc_dumps:
    get:
      summary: Mini-container dumps
      operationId: getMcDumps
      tags:
        - Dumps
      parameters:
        - $ref: "#/components/parameters/zipcode"
        - $ref: "#/components/parameters/number"
        - $ref: "#/components/parameters/letter"
        - $ref: "#/components/parameters/suffix"
        - $ref: "#/components/parameters/time_start"
        - $ref: "#/components/parameters/time_end"
      responses:
        "200":
          description: Array of dump rows for matching addresses in the given timespan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McDump"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  parameters:
    zipcode:
      name: zipcode
      in: query
      required: true
      description: Dutch postal code. Spaces are stripped and letters uppercased.
      schema:
        type: string
      example: "1234AB"

    number:
      name: number
      in: query
      required: true
      description: House number
      schema:
        type: integer
      example: 12

    letter:
      name: letter
      in: query
      required: false
      description: House letter. Defaults to empty string.
      schema:
        type: string
        default: ""
      example: "A"

    suffix:
      name: suffix
      in: query
      required: false
      description: House number addition. Defaults to empty string.
      schema:
        type: string
        default: ""
      example: "bis"

    time_start:
      name: time_start
      in: query
      required: true
      description: Start of the timespan (RFC 3339 datetime). Inclusive. Timezone Europe/Amsterdam when omitted.
      schema:
        type: string
        format: date-time
      example: "2026-01-01T00:00:00+01:00"

    time_end:
      name: time_end
      in: query
      required: true
      description: End of the timespan (RFC 3339 datetime). Inclusive. Timezone Europe/Amsterdam when omitted.
      schema:
        type: string
        format: date-time
      example: "2026-12-31T23:59:59+01:00"

  schemas:
    McDump:
      type: object
      properties:
        datetime:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 datetime in Europe/Amsterdam
          example: "2026-03-15T08:12:00+01:00"
        fraction:
          type: string
          nullable: true
          description: Fraction code
          example: GFT
        fraction_title:
          type: string
          nullable: true
          description: Fraction title
          example: GFT-afval
        weight:
          type: number
          format: double
          nullable: true
          description: Dump weight in kg
          example: 12.5

    Exception:
      type: object
      required:
        - code
        - description
      properties:
        code:
          type: string
          example: InvalidParameter
        description:
          type: string
          example: Parameter 'zipcode' is required

  responses:
    InvalidParameter:
      description: Invalid or missing query parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Exception"

    Unauthorized:
      description: Missing or invalid X-API-Key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Exception"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required for authentication

security:
  - ApiKeyAuth: []
